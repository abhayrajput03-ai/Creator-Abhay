<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creator Abhay | Secure Admin Control Center</title>
    <meta name="description" content="Admin dashboard for Creator Abhay - Manage website pricing, feedback limits, and settings securely.">
    
    <!-- Google Fonts for High-Tech & Professional Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #030305;
            --text-main: #f4f4f8;
            --text-muted: #94a3b8;
            --accent-primary: #00f3ff;
            --accent-secondary: #7928ca;
            --glass-bg: rgba(18, 18, 28, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-code: 'Share Tech Mono', monospace;
            --transition-smooth: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at center, #0d0d15 0%, #030305 100%);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Password Gate Overlay */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 3, 5, 0.95);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }

        .auth-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .auth-box {
            background: var(--glass-bg);
            border: 1px solid var(--accent-primary);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.25);
        }

        .auth-box h2 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1.1rem;
            outline: none;
            transition: var(--transition-smooth);
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 2rem;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #030305;
            background: linear-gradient(135deg, var(--accent-primary), #00bcd4);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.3);
            width: 100%;
        }

        .btn:hover {
            box-shadow: 0 6px 25px rgba(0, 243, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent-primary);
            color: var(--accent-primary);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: rgba(0, 243, 255, 0.1);
            color: #fff;
        }

        /* Admin Dashboard UI */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 950;
            color: #fff;
            letter-spacing: 2px;
        }

        .admin-logo span {
            color: var(--accent-primary);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .admin-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .admin-card h3 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-family: var(--font-code);
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .admin-card .form-control {
            margin-bottom: 0;
            text-align: left;
            letter-spacing: normal;
        }

        .status-msg {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: #00ffaa;
            margin-top: 0.5px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- PASSWORD GATE OVERLAY -->

    </div>

    <!-- BACKGROUND CANVAS -->
    <canvas id="particle-canvas"></canvas>

    <!-- ADMIN DASHBOARD CONTAINER -->
    <div class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
        
        <!-- Header -->
        <div class="admin-header">
            <div class="admin-logo">CREATOR <span>ABHAY</span> // ADMIN</div>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <span style="font-family: var(--font-code); font-size: 0.9rem; color: var(--text-muted);">User: reenarjput03@gmail.com</span>
                <a href="index.html" class="btn btn-outline" style="padding: 0.6rem 1.5rem; font-size: 0.85rem;">Go to Public Site</a>
            </div>

        <!-- Control Center Cards Grid -->
        <div class="admin-grid">
            
            <!-- Card 1: Pricing Controls -->
            <div class="admin-card">
                <h3>Pricing Control Center</h3>
                <form id="pricing-form">
                    <div class="input-group">
                        <label for="base-portfolio">Portfolio Base Price (₹)</label>

                    <div class="input-group">

                    </div>
                    <div class="input-group">

                        <input type="text" id="admin-whatsapp" class="form-control" value="9306882926" required>

                        <label for="admin-upi">Admin UPI ID</label>
                        <input type="text" id="admin-upi" class="form-control" value="9306882926@ptyes" required>

                    <div class="input-group">
                        <label for="admin-email">Registered Owner Email</label>
                        <input type="email" id="admin-email" class="form-control" value="reenarjput03@gmail.com" readonly style="opacity: 0.7; cursor: not-allowed;">

                    <div class="status-msg" id="settings-status">Configuration saved!</div>

    <!-- Admin Panel Logic -->
    <script>
        // --- 1. PASSWORD AUTHENTICATION GATE ---
        const authOverlay = document.getElementById('auth-overlay');
        const authForm = document.getElementById('auth-form');
        const authPassword = document.getElementById('auth-password');
        const authError = document.getElementById('auth-error');

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const correctPassword = "@@;-@]⁰¹²³";
            if (authPassword.value === correctPassword) {
                authOverlay.classList.add('hidden');
                localStorage.setItem('adminAuthenticated', 'true');
            } else {
                authError.style.display = 'block';
                authPassword.value = '';
            }
        });

        // Check if already authenticated in this session
        if (localStorage.getItem('adminAuthenticated') === 'true') {
            authOverlay.classList.add('hidden');
        }

        // --- 2. FORM SUBMISSIONS & CONFIG MANAGEMENT ---
        const pricingForm = document.getElementById('pricing-form');
        const pricingStatus = document.getElementById('pricing-status');
        
        pricingForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pricingData = {
                portfolio: document.getElementById('base-portfolio').value,
                business: document.getElementById('base-business').value,
                ecommerce: document.getElementById('base-ecommerce').value,
                webapp: document.getElementById('base-webapp').value
            };
            localStorage.setItem('adminPricing', JSON.stringify(pricingData));
            pricingStatus.style.display = 'block';
            setTimeout(() => { pricingStatus.style.display = 'none'; }, 3000);
        });

        const settingsForm = document.getElementById('settings-form');
        const settingsStatus = document.getElementById('settings-status');

        settingsForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const settingsData = {
                maxFeedbackWords: document.getElementById('max-feedback-words').value,
                whatsapp: document.getElementById('admin-whatsapp').value,
                upi: document.getElementById('admin-upi').value
            };
            localStorage.setItem('adminSettings', JSON.stringify(settingsData));
            settingsStatus.style.display = 'block';
            setTimeout(() => { settingsStatus.style.display = 'none'; }, 3000);
        });

        // --- 3. BACKGROUND CANVAS ENGINE ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
                this.color = '#00f3ff';
                this.alpha = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();
    </script>
</body>
